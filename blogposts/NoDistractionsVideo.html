<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="https://matchamakes.net/images/no distractions icon.png" sizes="32x32">
  <link rel="apple-touch-icon" href="https://matchamakes.net/images/no distractions icon.png">
  <link rel="shortcut icon" href="https://matchamakes.net/images/no distractions icon.png">
  <script>
    // If you don't have /partials/footer.html locally, this will 404 harmlessly.
    fetch('/partials/footer.html')
      .then(res => res.text())
      .then(html => document.getElementById('footer').innerHTML = html)
      .catch(()=>{});
  </script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Distraction-free Video</title>
<style>
  :root{
    --bg:#0b0b0b;
    --panel:#0f0f0f;
    --muted:#999;
    --accent:#e6e6e6;
  }
  html,body{height:100%;margin:0;background:var(--bg);color:var(--accent);font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;gap:18px}
  .panel{
    width:100%;
    max-width:920px;
    background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
    border-radius:12px;
    padding:16px;
    box-shadow:0 8px 30px rgba(0,0,0,0.6);
    backdrop-filter: blur(6px);
  }
  .controls{display:flex;gap:8px;align-items:center}
  input[type="url"]{
    flex:1;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:var(--panel);color:var(--accent);outline:none;font-size:15px;
  }
  button{
    padding:10px 14px;border-radius:8px;border:none;background:#1f1f1f;color:var(--accent);cursor:pointer;font-weight:600;
  }
  .opts{display:flex;gap:12px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
  label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
  .player-wrap{
    margin-top:14px;
    position:relative;
    width:100%;
    padding-top:56.25%;
    background:#000;
    border-radius:10px;
    overflow:hidden;
  }
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
  .ui-hidden .panel{opacity:0;pointer-events:none;height:0;padding:0;margin:0}
  .hint{font-size:12px;color:var(--muted);margin-top:8px}
  .mini-actions{display:flex;gap:8px;align-items:center;margin-left:auto}
  .floating{
    position:fixed;right:16px;top:16px;background:rgba(0,0,0,0.45);padding:8px;border-radius:8px;color:var(--muted);font-size:13px;border:1px solid rgba(255,255,255,0.03)
  }
  .error{color:#ff6b6b;font-size:13px;margin-top:8px}
  .queue-section{margin-top:20px;}
  .queue-section h4{margin-bottom:8px;font-size:15px;}
  .queue-inputs{display:flex;flex-direction:column;gap:6px;}
  @media (max-width:560px){
    .wrap{padding:12px}
    .panel{padding:12px}
  }
</style>
</head>
<body>
  <div class="wrap" id="root">
    <div class="panel" id="panel">
      <div style="display:flex;align-items:center;gap:8px">
        <div style="font-weight:700;font-size:16px">Distraction-free Video</div>
        <div class="mini-actions" style="margin-left:auto">
          <button id="toggleUI" title="Toggle controls (press 'i')">Hide UI</button>
          <button id="fullscreenBtn" title="Fullscreen player (press 'f')">Fullscreen</button>
        </div>
      </div>

      <div style="margin-top:12px" class="controls">
        <input id="urlInput" type="url" placeholder="Paste YouTube or Twitch VOD URL">
        <button id="playBtn">Play</button>
      </div>

      <div class="opts">
        <label><input id="autoplay" type="checkbox" checked> Autoplay</label>
        <label><input id="hideControls" type="checkbox" checked> Hide YouTube controls</label>
        <label><input id="privacy" type="checkbox"> Use youtube-nocookie</label>
        <label style="margin-left:auto"><input id="loop" type="checkbox"> Loop</label>
      </div>

      <div class="queue-section">
        <h4>Up Next</h4>
        <div class="queue-inputs">
          <input type="url" id="queue1" class="queue-input" placeholder="Up Next #1">
          <input type="url" id="queue2" class="queue-input" placeholder="Up Next #2">
          <input type="url" id="queue3" class="queue-input" placeholder="Up Next #3">
          <input type="url" id="queue4" class="queue-input" placeholder="Up Next #4">
          <input type="url" id="queue5" class="queue-input" placeholder="Up Next #5">
        </div>
        <button id="playNextBtn" style="margin-top:10px;">Play Next</button>
      </div>

     <div class="hint">After you click Play the controls will fade. Press <strong>0</strong> to toggle the UI back and forth, <strong>9</strong> to fullscreen, <strong>Esc</strong> to exit fullscreen.</div>

      <div id="error" class="error" role="alert" style="display:none"></div>

      <div class="player-wrap" id="playerWrap" aria-live="polite" style="margin-top:12px">
        <div id="placeholder" style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted)">No video loaded</div>
      </div>
    </div>

    <div class="floating" id="floating" style="display:none">UI hidden — press 0 to show</div>
  </div>

<script>
function extractVideoInfo(url) {
  if (!url) return null;
  try {
    const u = new URL(url.includes('://') ? url : 'https://' + url);
    const host = u.hostname.replace('www.','').toLowerCase();

    if (/^[A-Za-z0-9_-]{11}$/.test(url.trim())) {
      return { type: 'youtube', id: url.trim() };
    }
    if (host === 'youtu.be') {
      const id = u.pathname.slice(1).split(/[\/?&]/)[0];
      return id ? { type: 'youtube', id } : null;
    }
    if (host.endsWith('youtube.com') || host.endsWith('youtube-nocookie.com')) {
      const v = u.searchParams.get('v');
      if (v && /^[A-Za-z0-9_-]{11}$/.test(v)) return { type: 'youtube', id: v };
      const pathParts = u.pathname.split('/');
      const embedIndex = pathParts.indexOf('embed');
      if (embedIndex !== -1 && pathParts[embedIndex+1]) {
        const id = pathParts[embedIndex+1].split(/[\/?&]/)[0];
        if (/^[A-Za-z0-9_-]{11}$/.test(id)) return { type: 'youtube', id };
      }
      return null;
    }

    if (host.endsWith('twitch.tv')) {
      const parts = u.pathname.split('/').filter(Boolean);
      const idx = parts.indexOf('videos');
      if (idx !== -1 && parts[idx+1]) {
        return { type: 'twitch_vod', id: parts[idx+1] };
      }
      if (parts.length === 1) {
        return { type: 'twitch_live', id: parts[0] };
      }
      return null;
    }

    return null;
  } catch(e) {
    return null;
  }
}

function buildSrc(info, opts) {
  const parent = window.location.hostname;

  if (info.type === 'youtube') {
    const domain = opts.privacy ? 'https://www.youtube-nocookie.com' : 'https://www.youtube.com';
    const params = new URLSearchParams();
    params.set('autoplay', opts.autoplay ? '1' : '0');
    params.set('rel', '0');
    params.set('modestbranding', '1');
    params.set('playsinline', '1');
    params.set('iv_load_policy', '3');
    params.set('controls', opts.hideControls ? '0' : '1');
    if (opts.loop) {
      params.set('loop', '1');
      params.set('playlist', info.id);
    }
    return `${domain}/embed/${info.id}?${params.toString()}`;
  }

  if (info.type === 'twitch_vod') {
    return `https://player.twitch.tv/?video=${info.id}&parent=${parent}&autoplay=${opts.autoplay ? 'true' : 'false'}`;
  }

  if (info.type === 'twitch_live') {
    return `https://player.twitch.tv/?channel=${info.id}&parent=${parent}&autoplay=${opts.autoplay ? 'true' : 'false'}`;
  }

  return '';
}

function showError(msg){
  errorEl.style.display = 'block';
  errorEl.textContent = msg;
}
function clearError(){
  errorEl.style.display = 'none';
  errorEl.textContent = '';
}

function loadVideo(info){
  clearError();
  const old = playerWrap.querySelector('iframe');
  if (old) old.remove();
  placeholder.style.display = 'none';
  const autoplay = document.getElementById('autoplay').checked;
  const hideControls = document.getElementById('hideControls').checked;
  const privacy = document.getElementById('privacy').checked;
  const loop = document.getElementById('loop').checked;
  const src = buildSrc(info, {autoplay, hideControls, privacy, loop});
  const iframe = document.createElement('iframe');
  iframe.src = src;
  iframe.allow = 'autoplay; fullscreen; picture-in-picture';
  iframe.allowFullscreen = true;
  iframe.title = info.type.startsWith('twitch') ? 'Twitch player' : 'YouTube player';
  playerWrap.appendChild(iframe);
  setTimeout(() => {
    document.body.classList.add('ui-hidden');
    floating.style.display = 'block';
  }, 350);
}

const playBtn = document.getElementById('playBtn');
const playNextBtn = document.getElementById('playNextBtn');
const urlInput = document.getElementById('urlInput');
const queue1 = document.getElementById('queue1');
const queue2 = document.getElementById('queue2');
const queue3 = document.getElementById('queue3');
const queue4 = document.getElementById('queue4');
const queue5 = document.getElementById('queue5');
const playerWrap = document.getElementById('playerWrap');
const placeholder = document.getElementById('placeholder');
const errorEl = document.getElementById('error');
const panel = document.getElementById('panel');
const floating = document.getElementById('floating');
const toggleUI = document.getElementById('toggleUI');
const fullscreenBtn = document.getElementById('fullscreenBtn');

playBtn.addEventListener('click', ()=>{
  clearError();
  const url = urlInput.value.trim();
  const info = extractVideoInfo(url);
  if (!info){
    showError('Invalid YouTube or Twitch URL.');
    return;
  }
  loadVideo(info);
});

playNextBtn.addEventListener('click', ()=>{
  clearError();
  const queueInputs = [queue1, queue2, queue3, queue4, queue5];
  for (let i = 0; i < queueInputs.length; i++) {
    const url = queueInputs[i].value.trim();
    if (url) {
      const info = extractVideoInfo(url);
      if (info) {
        loadVideo(info);
        queueInputs[i].value = '';
        break;
      }
    }
  }
});

urlInput.addEventListener('keydown', (e)=>{
  if (e.key === 'Enter') {
    e.preventDefault();
    playBtn.click();
  }
});

/*
  Only intercept paste when urlInput has focus.
  This fixes the problem where paste into Up Next boxes was blocked.
*/
document.addEventListener('paste', (ev)=>{
  const active = document.activeElement;
  const text = (ev.clipboardData || window.clipboardData).getData('text');
  if (active === urlInput && text && extractVideoInfo(text)){
    ev.preventDefault();
    urlInput.value = text;
    clearError();
  }
  // otherwise do nothing and allow normal paste into queue inputs or other fields
});

function toggleUIVisibility(force){
  const hidden = document.body.classList.contains('ui-hidden');
  const willHide = typeof force === 'boolean' ? force : !hidden;
  if (willHide){
    document.body.classList.add('ui-hidden');
    floating.style.display = 'block';
    toggleUI.textContent = 'Show UI';
  } else {
    document.body.classList.remove('ui-hidden');
    floating.style.display = 'none';
    toggleUI.textContent = 'Hide UI';
  }
}
toggleUI.addEventListener('click', ()=>toggleUIVisibility());

fullscreenBtn.addEventListener('click', async ()=>{
  const iframe = playerWrap.querySelector('iframe');
  if (!iframe) return;
  try{
    if (document.fullscreenElement) {
      await document.exitFullscreen();
    } else {
      await playerWrap.requestFullscreen();
    }
  }catch(e){}
});

document.addEventListener('keydown', (e)=>{
  if (e.key === '0') toggleUIVisibility();
  if (e.key === '9') fullscreenBtn.click();
});

window.addEventListener('load', ()=>{ urlInput.focus(); });
</script>

<h5> updated 251103 - added twitch vod support + queue system. </h5>

<script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
</body>
<div id="footer"></div>
</html>
