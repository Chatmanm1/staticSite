<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Distraction-free Video</title>
  <link rel="icon" type="image/png" href="https://matchamakes.net/images/no distractions icon.png" sizes="32x32">
  <link rel="apple-touch-icon" href="https://matchamakes.net/images/no distractions icon.png">
  <link rel="shortcut icon" href="https://matchamakes.net/images/no distractions icon.png">
  <style>
    :root {
      --bg: #0b0b0b;
      --panel: #0f0f0f;
      --muted: #999;
      --accent: #e6e6e6;
    }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--accent);
      font-family: Inter, ui-sans-serif, system-ui, Segoe UI, Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px;
      gap: 18px;
      box-sizing: border-box;
    }
    .panel {
      width: 100%;
      max-width: 920px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      box-sizing: border-box;
    }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 12px;
    }
    input[type="url"] {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.06);
      background: var(--panel);
      color: var(--accent);
      outline: none;
      font-size: 15px;
    }
    input[type="url"]:focus {
      border-color: rgba(255,255,255,0.2);
    }
    button {
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      background: #1f1f1f;
      color: var(--accent);
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    button:hover {
      background: #2a2a2a;
    }
    .opts {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
      flex-wrap: wrap;
    }
    label {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      cursor: pointer;
    }
    .queue-section {
      margin-top: 20px;
    }
    .queue-section h4 {
      margin: 0 0 8px 0;
      font-size: 15px;
    }
    .queue-inputs {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .player-wrap {
      margin-top: 14px;
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }
    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
    .ui-hidden .panel {
      opacity: 0;
      pointer-events: none;
      height: 0;
      padding: 0;
      margin: 0;
      overflow: hidden;
    }
    .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 12px;
    }
    .mini-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-left: auto;
    }
    .floating {
      position: fixed;
      right: 16px;
      top: 16px;
      background: rgba(0,0,0,0.45);
      padding: 8px;
      border-radius: 8px;
      color: var(--muted);
      font-size: 13px;
      border: 1px solid rgba(255,255,255,0.03);
      z-index: 10;
    }
    .error {
      color: #ff6b6b;
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }
    @media (max-width: 560px) {
      .wrap, .panel { padding: 12px; }
      .opts { flex-direction: column; align-items: flex-start; }
      .opts label { margin-left: 0 !important; }
    }
  </style>
  <script>
    fetch('/partials/footer.html')
      .then(res => res.text())
      .then(html => {
        const footerEl = document.getElementById('footer');
        if (footerEl) footerEl.innerHTML = html;
      })
      .catch(() => {});
  </script>
</head>
<body>
  <div class="wrap" id="root">
    <div class="panel" id="panel">
      <div style="display:flex;align-items:center;gap:8px">
        <div style="font-weight:700;font-size:16px">Distraction-free Video</div>
        <div class="mini-actions">
          <button id="toggleUI" aria-label="Toggle user interface">Hide UI</button>
          <button id="fullscreenBtn" aria-label="Toggle fullscreen">Fullscreen</button>
        </div>
      </div>

      <div class="controls">
        <input id="urlInput" type="url" placeholder="Paste YouTube or Twitch VOD URL" aria-label="Video URL">
        <button id="playBtn">Play</button>
      </div>

      <div class="opts">
        <label><input id="autoplay" type="checkbox" checked> Autoplay</label>
        <label><input id="hideControls" type="checkbox" checked> Hide YouTube controls</label>
        <label><input id="privacy" type="checkbox"> Use youtube-nocookie</label>
        <label style="margin-left:auto"><input id="loop" type="checkbox"> Loop</label>
      </div>

      <div class="queue-section">
        <h4>Up Next</h4>
        <div class="queue-inputs" id="queueContainer">
          <input type="url" class="queue-input" placeholder="Up Next #1" aria-label="Queue slot 1">
          <input type="url" class="queue-input" placeholder="Up Next #2" aria-label="Queue slot 2">
          <input type="url" class="queue-input" placeholder="Up Next #3" aria-label="Queue slot 3">
          <input type="url" class="queue-input" placeholder="Up Next #4" aria-label="Queue slot 4">
          <input type="url" class="queue-input" placeholder="Up Next #5" aria-label="Queue slot 5">
        </div>
        <button id="playNextBtn" style="margin-top:10px;">Play Next</button>
      </div>

      <div class="hint">Press <strong>0</strong> to toggle the UI, <strong>9</strong> to fullscreen, <strong>Esc</strong> to exit fullscreen.</div>
      <div id="error" class="error" role="alert"></div>

      <div class="player-wrap" id="playerWrap" aria-live="polite">
        <div id="placeholder" style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted)">No video loaded</div>
      </div>
      <h5 style="color:var(--muted); font-size: 11px; margin-top: 12px; font-weight: normal;">updated 251103 - added twitch vod support + queue system.</h5>
    </div>
    <div class="floating" id="floating" style="display:none">UI hidden — press 0 to show</div>
  </div>
  <div id="footer"></div>

  <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
  <script>
    function extractVideoInfo(url) {
      if (!url) return null;
      try {
        const u = new URL(url.includes('://') ? url : 'https://' + url);
        const host = u.hostname.replace('www.','').toLowerCase();

        if (/^[A-Za-z0-9_-]{11}$/.test(url.trim())) {
          return { type: 'youtube', id: url.trim() };
        }
        if (host === 'youtu.be') {
          const id = u.pathname.slice(1).split(/[\/?&]/)[0];
          return id ? { type: 'youtube', id } : null;
        }
        if (host.endsWith('youtube.com') || host.endsWith('youtube-nocookie.com')) {
          const v = u.searchParams.get('v');
          if (v && /^[A-Za-z0-9_-]{11}$/.test(v)) return { type: 'youtube', id: v };
          const pathParts = u.pathname.split('/');
          const embedIndex = pathParts.indexOf('embed');
          if (embedIndex !== -1 && pathParts[embedIndex+1]) {
            const id = pathParts[embedIndex+1].split(/[\/?&]/)[0];
            if (/^[A-Za-z0-9_-]{11}$/.test(id)) return { type: 'youtube', id };
          }
          return null;
        }

        if (host.endsWith('twitch.tv')) {
          const parts = u.pathname.split('/').filter(Boolean);
          const idx = parts.indexOf('videos');
          if (idx !== -1 && parts[idx+1]) {
            return { type: 'twitch_vod', id: parts[idx+1] };
          }
          if (parts.length === 1) {
            return { type: 'twitch_live', id: parts[0] };
          }
        }
        return null;
      } catch(e) {
        return null;
      }
    }

    function buildSrc(info, opts) {
      const parent = window.location.hostname || 'localhost';

      if (info.type === 'youtube') {
        const domain = opts.privacy ? 'https://www.youtube-nocookie.com' : 'https://www.youtube.com';
        const params = new URLSearchParams();
        params.set('autoplay', opts.autoplay ? '1' : '0');
        params.set('rel', '0');
        params.set('modestbranding', '1');
        params.set('playsinline', '1');
        params.set('iv_load_policy', '3');
        params.set('controls', opts.hideControls ? '0' : '1');
        if (opts.loop) {
          params.set('loop', '1');
          params.set('playlist', info.id);
        }
        return `${domain}/embed/${info.id}?${params.toString()}`;
      }

      if (info.type === 'twitch_vod') {
        return `https://player.twitch.tv/?video=${info.id}&parent=${parent}&autoplay=${opts.autoplay}`;
      }

      if (info.type === 'twitch_live') {
        return `https://player.twitch.tv/?channel=${info.id}&parent=${parent}&autoplay=${opts.autoplay}`;
      }

      return '';
    }

    const errorEl = document.getElementById('error');
    function showError(msg) {
      errorEl.style.display = 'block';
      errorEl.textContent = msg;
    }
    function clearError() {
      errorEl.style.display = 'none';
      errorEl.textContent = '';
    }

    function loadVideo(info) {
      clearError();
      const playerWrap = document.getElementById('playerWrap');
      const placeholder = document.getElementById('placeholder');
      const old = playerWrap.querySelector('iframe');
      if (old) old.remove();
      placeholder.style.display = 'none';

      const autoplay = document.getElementById('autoplay').checked;
      const hideControls = document.getElementById('hideControls').checked;
      const privacy = document.getElementById('privacy').checked;
      const loop = document.getElementById('loop').checked;

      const src = buildSrc(info, { autoplay, hideControls, privacy, loop });
      const iframe = document.createElement('iframe');
      iframe.src = src;
      iframe.allow = 'autoplay; fullscreen; picture-in-picture';
      iframe.allowFullscreen = true;
      iframe.title = info.type.startsWith('twitch') ? 'Twitch player' : 'YouTube player';
      playerWrap.appendChild(iframe);

      setTimeout(() => {
        document.body.classList.add('ui-hidden');
        document.getElementById('floating').style.display = 'block';
      }, 350);
    }

    document.getElementById('playBtn').addEventListener('click', () => {
      clearError();
      const urlInput = document.getElementById('urlInput');
      const url = urlInput.value.trim();
      const info = extractVideoInfo(url);
      if (!info) {
        showError('Invalid YouTube or Twitch URL.');
        return;
      }
      loadVideo(info);
    });

    document.getElementById('playNextBtn').addEventListener('click', () => {
      clearError();
      const queueInputs = Array.from(document.querySelectorAll('.queue-input'));
      let played = false;

      for (let i = 0; i < queueInputs.length; i++) {
        const url = queueInputs[i].value.trim();
        if (url && !played) {
          const info = extractVideoInfo(url);
          if (info) {
            loadVideo(info);
            played = true;
            queueInputs[i].value = '';
          }
        }
      }

      if (played) {
        const values = queueInputs.map(input => input.value.trim()).filter(Boolean);
        queueInputs.forEach((input, index) => {
          input.value = values[index] || '';
        });
      }
    });

    const urlInput = document.getElementById('urlInput');
    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('playBtn').click();
      }
    });

    document.addEventListener('paste', (ev) => {
      const active = document.activeElement;
      const text = (ev.clipboardData || window.clipboardData).getData('text');
      if (active === urlInput && text && extractVideoInfo(text)) {
        ev.preventDefault();
        urlInput.value = text;
        clearError();
      }
    });

    function toggleUIVisibility(force) {
      const hidden = document.body.classList.contains('ui-hidden');
      const willHide = typeof force === 'boolean' ? force : !hidden;
      const floating = document.getElementById('floating');
      const toggleUI = document.getElementById('toggleUI');

      if (willHide) {
        document.body.classList.add('ui-hidden');
        floating.style.display = 'block';
        toggleUI.textContent = 'Show UI';
      } else {
        document.body.classList.remove('ui-hidden');
        floating.style.display = 'none';
        toggleUI.textContent = 'Hide UI';
      }
    }

    document.getElementById('toggleUI').addEventListener('click', () => toggleUIVisibility());

    document.getElementById('fullscreenBtn').addEventListener('click', async () => {
      const playerWrap = document.getElementById('playerWrap');
      const iframe = playerWrap.querySelector('iframe');
      if (!iframe) return;
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await playerWrap.requestFullscreen();
        }
      } catch(e) {}
    });

    document.addEventListener('keydown', (e) => {
      const activeTag = document.activeElement.tagName.toLowerCase();
      if (activeTag === 'input' || activeTag === 'textarea') return;

      if (e.key === '0') toggleUIVisibility();
      if (e.key === '9') document.getElementById('fullscreenBtn').click();
    });

    window.addEventListener('load', () => { urlInput.focus(); });
  </script>
</body>
</html>
