
<html lang="en">
<head>

 <script>
    // Load header

  <meta charset="UTF-8" />

</head>
<body>

    <h3> Feedback</h3>
    <p> Thank you for very much for taking the time to file feedback! I appreciate it all. </p>

  <script>
    const GOOGLE_FORM_URL = "1FAIpQLScwXPbFF5dKUHCqt3ZY1pg_xftB41XVL_zFv_Wyd5e0U9vJlQ";
    const FORM_ENTRIES = [
      "entry.1303550359", // first entry field
      "entry.1297821223", // second entry field
      "entry.1619323146"  // user id or identifier
    ];

    function getUserId() {
      return "user-" + Math.floor(Math.random() * 100000);
    }

    function submitSelections() {
      let data = new URLSearchParams();

      // Entry 1
      const entry1 = document.getElementById("entry1").value.trim();
      data.append(FORM_ENTRIES[0], entry1);

      // Entry 2
      const entry2 = document.getElementById("entry2").value.trim();
      data.append(FORM_ENTRIES[1], entry2);

      // User ID
      data.append(FORM_ENTRIES[2], getUserId());

      fetch(GOOGLE_FORM_URL, { method: "POST", body: data, mode: "no-cors" })
        .then(() => alert("Submitted!"))
        .catch(err => console.error("Submission error:", err));
    }
  </script>
  <style>
    body {
      font-family: sans-serif;

    .container {
      display: inline-block;
      text-align: left;
    }
    .button {
      margin-top: 20px;
      padding: 10px 20px;
    }
  </style>

</body>
  <!-- Footer -->
  <div id="footer"></div>
</html>
