<html lang="en">
<head>
  <div id="header"></div>
  <script>
    // Load header and footer
    fetch('/partials/header.html')
      .then(res => res.text())
      .then(html => document.getElementById('header').innerHTML = html);

    fetch('/partials/footer.html')
      .then(res => res.text())
      .then(html => document.getElementById('footer').innerHTML = html);
  </script>

  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://matchamakes.net/style.css" />
</head>
<body>
  <h3>Feedback</h3>
  <p>Thank you very much for taking the time to file feedback!</p>

  <div class="container">
    <label for="entry1">Feedback Title:</label><br>
    <input type="text" id="entry1" name="entry1" placeholder="Enter a short title" style="width:100%;padding:8px;"><br><br>

    <label for="entry2">Feedback Details:</label><br>
    <textarea id="entry2" name="entry2" placeholder="Enter details here" style="width:100%;height:120px;padding:8px;"></textarea><br><br>

    <button class="button" onclick="submitSelections()">Submit</button>
  </div>

  <script>
    const GOOGLE_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLScwXPbFF5dKUHCqt3ZY1pg_xftB41XVL_zFv_Wyd5e0U9vJlQ/formResponse";
    const FORM_ENTRIES = [
      "entry.1303550359", // first entry field
      "entry.1297821223", // second entry field
      "entry.1619323146"  // user id
    ];

    function getUserId() {
      return "user-" + Math.floor(Math.random() * 100000);
    }

    function submitSelections() {
      const entry1 = document.getElementById("entry1").value.trim();
      const entry2 = document.getElementById("entry2").value.trim();

      if (!entry1 || !entry2) {
        alert("Please fill out both fields before submitting.");
        return;
      }

      const data = new URLSearchParams();
      data.append(FORM_ENTRIES[0], entry1);
      data.append(FORM_ENTRIES[1], entry2);
      data.append(FORM_ENTRIES[2], getUserId());

      fetch(GOOGLE_FORM_URL, { method: "POST", body: data, mode: "no-cors" })
        .then(() => alert("Submitted!"))
        .catch(err => console.error("Submission error:", err));
    }
  </script>

  <style>
    body {
      font-family: Roboto, sans-serif;
      text-align: center;
      margin: 50px;
    }
    .container {
      display: inline-block;
      text-align: left;
      max-width: 400px;
      width: 100%;
    }
    .button {
      margin-top: 10px;
      padding: 10px 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .button:hover {
      background: #005fcc;
    }
  </style>

  <div id="footer"></div>
</body>
</html>
