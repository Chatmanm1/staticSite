<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RSS Feed Reader</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f8f8f8; }
    header { background: #444; color: white; padding: 1em; }
    nav button { margin: 0 5px; }
    #content { padding: 1em; }
    .entry { background: white; margin: 10px 0; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .entry h3 { margin: 0 0 5px 0; }
    .entry small { display: block; margin-bottom: 10px; color: #555; }
    button { cursor: pointer; margin-right: 5px; }
    #feeds-list { list-style: none; padding: 0; }
    #feeds-list li { padding: 5px 0; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <header>
    <h1>RSS Feed Reader</h1>
    <nav>
      <button onclick="showTab('feeds')">Feeds</button>
      <button onclick="showTab('settings')">Settings</button>
    </nav>
  </header>

  <div id="content">
    <!-- Feeds Tab -->
    <div id="feeds-tab">
      <button onclick="fetchFeeds()">Refresh Feeds</button>
      <div id="feed-entries"></div>
    </div>

    <!-- Settings Tab -->
    <div id="settings-tab" style="display:none;">
      <label>Enter RSS Feed URL or YouTube Channel ID:</label><br>
      <input type="text" id="feed-input" size="60">
      <button onclick="addFeed()">Add RSS Feed</button>
      <button onclick="addYouTubeFeed()">Add YouTube Feed</button>

      <h3>Saved Feeds</h3>
      <ul id="feeds-list"></ul>
    </div>
  </div>

<script>
  let FEED_URLS = JSON.parse(localStorage.getItem("feeds") || "[]");

  function saveFeeds() {
    localStorage.setItem("feeds", JSON.stringify(FEED_URLS));
  }

  function showTab(tab) {
    document.getElementById("feeds-tab").style.display = tab === "feeds" ? "block" : "none";
    document.getElementById("settings-tab").style.display = tab === "settings" ? "block" : "none";
  }

  async function fetchFeeds() {
    const container = document.getElementById("feed-entries");
    container.innerHTML = "Loading...";
    let allEntries = [];

    for (let url of FEED_URLS) {
      try {
        // Use a proxy because browsers block direct RSS XML fetches (CORS).
        const res = await fetch("https://api.allorigins.win/get?url=" + encodeURIComponent(url));
        const data = await res.json();
        const xml = new window.DOMParser().parseFromString(data.contents, "text/xml");

        const source = xml.querySelector("channel > title")?.textContent || "Unknown Source";
        const items = Array.from(xml.querySelectorAll("item")).slice(0, 3);

        for (let item of items) {
          let title = item.querySelector("title")?.textContent || "No title";
          let link = item.querySelector("link")?.textContent;
          let pubDate = item.querySelector("pubDate")?.textContent || "No date";
          let desc = item.querySelector("description")?.textContent || "No content";

          allEntries.push({title, link, pubDate, desc, source});
        }
      } catch (err) {
        console.error("Error fetching feed:", url, err);
      }
    }

    allEntries.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
    allEntries = allEntries.slice(0, 50);

    container.innerHTML = "";
    for (let entry of allEntries) {
      const div = document.createElement("div");
      div.className = "entry";
      div.innerHTML = `
        <h3>${entry.source}: ${entry.title}</h3>
        <small>Published: ${entry.pubDate}</small>
        <button onclick="window.open('${entry.link}', '_blank')">View Online</button>
        <button onclick="alert(${JSON.stringify(entry.desc)})">Read Here</button>
      `;
      container.appendChild(div);
    }
  }

  function addFeed() {
    const input = document.getElementById("feed-input");
    const url = input.value.trim();
    if (url && !FEED_URLS.includes(url)) {
      FEED_URLS.push(url);
      saveFeeds();
      updateFeedList();
      input.value = "";
    }
  }

  function addYouTubeFeed() {
    const input = document.getElementById("feed-input");
    const channelId = input.value.trim();
    if (channelId) {
      const fullUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`;
      if (!FEED_URLS.includes(fullUrl)) {
        FEED_URLS.push(fullUrl);
        saveFeeds();
        updateFeedList();
        input.value = "";
      }
    }
  }

  function removeFeed(index) {
    FEED_URLS.splice(index, 1);
    saveFeeds();
    updateFeedList();
  }

  function updateFeedList() {
    const list = document.getElementById("feeds-list");
    list.innerHTML = "";
    FEED_URLS.forEach((url, idx) => {
      const li = document.createElement("li");
      li.innerHTML = `<span>${url}</span> <button onclick="removeFeed(${idx})">Remove</button>`;
      list.appendChild(li);
    });
  }

  // Auto-refresh every 15 minutes
  setInterval(fetchFeeds, 900000);

  // Initial setup
  updateFeedList();
  fetchFeeds();
</script>
</body>
</html>
