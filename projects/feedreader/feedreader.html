<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Feed Reader</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; background: #f9f9f9; }
    .feed { margin-bottom: 3rem; }
    .feed h2 { margin-bottom: 0.5rem; }
    .entry { padding: 0.5rem 0; border-bottom: 1px solid #ddd; }
    .entry a { text-decoration: none; color: #0066cc; }
    .entry a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Feed Reader</h1>
  <div id="feeds"></div>

  <script>
    async function loadFeeds() {
      try {
        // Load feeds.json from the same folder
        const res = await fetch("feeds.json");
        const data = await res.json();
        const feedUrls = data.feeds || [];

        const container = document.getElementById("feeds");

        for (const url of feedUrls) {
          // Use rss2json to convert RSS into JSON
          const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`;
          const feedRes = await fetch(apiUrl);
          const feedData = await feedRes.json();

          const feedDiv = document.createElement("div");
          feedDiv.className = "feed";

          const title = document.createElement("h2");
          title.textContent = feedData.feed ? feedData.feed.title : url;
          feedDiv.appendChild(title);

          if (feedData.items) {
            feedData.items.slice(0, 5).forEach(item => {
              const entry = document.createElement("div");
              entry.className = "entry";

              const link = document.createElement("a");
              link.href = item.link;
              link.target = "_blank";
              link.textContent = item.title;

              entry.appendChild(link);
              feedDiv.appendChild(entry);
            });
          }

          container.appendChild(feedDiv);
        }
      } catch (err) {
        console.error("Error loading feeds:", err);
      }
    }

    loadFeeds();
  </script>
</body>
</html>
