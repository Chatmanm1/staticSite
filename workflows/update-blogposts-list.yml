name: Update Blog Posts List

on:
  push:
    branches:
      - main  # change if your default branch is different

jobs:
  update-blogposts-list:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Generate blog post list and inject into index.html
      run: |
        folder="blogposts"
        index="index.html"
        placeholder="<!-- FILE_LIST -->"
        
        # Build the HTML list
        file_list="<ul>"
        for f in $(ls $folder); do
          file_list="$file_list<li><a href=\"$folder/$f\">$f</a></li>"
        done
        file_list="$file_list</ul>"
        
        # Replace placeholder in index.html
        sed -i "s|$placeholder|$file_list|" $index

    - name: Commit changes
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add index.html
        git commit -m "Update blog posts list" || echo "No changes to commit"
        git push
